<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tasker</title>
    <meta name="description" content="Спільний Kanban та персональні фінанси" />
    <meta name="theme-color" content="#0a0a10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tasker" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // vh/svh/dvh/-webkit-fill-available have all proven unreliable in this app on real
      // devices (each has computed shorter than the actual screen on at least one tested
      // phone, in both standalone and plain Safari-tab mode) - window.innerHeight is the old,
      // boring, universally-correct way to get the real viewport height, so the app shell is
      // sized from that instead.
      //
      // On load, Safari's own chrome (URL bar) is still fully expanded, so the very first
      // window.innerHeight reading undershoots what's available once it later collapses (e.g.
      // on scroll) - that's exactly the gap this was meant to fix in the first place. So this
      // only ever grows the recorded height on 'resize', never shrinks it, which also means a
      // keyboard opening (which shrinks innerHeight on some Android browsers) can't shrink the
      // shell out from under itself. A real orientation change legitimately changes the
      // geometry, so that resets the baseline and remeasures fresh.
      (function () {
        var maxHeight = 0;
        function setAppHeight() {
          if (window.innerHeight > maxHeight) {
            maxHeight = window.innerHeight;
            document.documentElement.style.setProperty('--app-height', maxHeight + 'px');
          }
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function () {
          maxHeight = 0;
          setTimeout(setAppHeight, 100);
        });
      })();

      // A `position: fixed; bottom: 0` element is positioned against the LAYOUT viewport, which
      // on iOS Safari can end up shorter than the VISUAL viewport actually on screen (the two are
      // meant to match, but this has been observed diverging here) - the fixed element then sits
      // above the true bottom edge by the difference, which is exactly the gap under the bottom
      // nav this is trying to close. visualViewport reports what's really drawn on screen, so
      // measure the gap between it and window.innerHeight directly and shift the nav down to
      // close it, instead of trusting bottom: 0 to already be correct.
      (function () {
        function updateNavOffset() {
          if (!window.visualViewport) return;
          var vv = window.visualViewport;
          var visibleBottom = vv.height + vv.offsetTop;
          // How much MORE is actually visible on screen than window.innerHeight (the layout
          // viewport fixed positioning is anchored to) accounts for. Push the nav down into
          // that extra space with a negative `bottom` - 0 (or clamped away) if there's none.
          var extra = visibleBottom - window.innerHeight;
          document.documentElement.style.setProperty('--nav-bottom-offset', -Math.max(0, extra) + 'px');
        }
        updateNavOffset();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateNavOffset);
          window.visualViewport.addEventListener('scroll', updateNavOffset);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
